name: External cron backstop

# pg_cron inside Supabase is the PRIMARY scheduler: it drains the SMS and e-mail
# notification queues every five minutes and runs the daily housekeeping jobs.
# This workflow is the BACKSTOP and dead-man's switch: if pg_cron stalls
# (extension disabled, project paused, scheduler incident) it keeps both
# notification drains moving and makes the outage visible through /api/health.
#
# GitHub's scheduler is best-effort, so this is a safety net rather than a
# clock. Every six hours catches a stalled pg_cron within a working day at
# almost no Actions cost.
#
# The auction tick + bid-queue drain that used to run here are gone. The
# auction product was retired, /api/cron/auctions/tick no longer exists, and a
# step that exits 1 on its 404 failed this workflow on every run.
#
# Required repo config: secret CRON_SECRET (matching the deployment's) and
# variable SITE_URL (e.g. https://mazedland.vercel.app). Without the secret the
# job SKIPS cleanly instead of failing, so it pages nobody before it has been
# configured.
#
# The secret travels in an Authorization header, never in the URL. A query
# string is written verbatim into request logs, proxies and CDN traces; a
# header is not.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-backstop
  cancel-in-progress: false

jobs:
  backstop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: "${{ vars.SITE_URL || 'https://mazedland.vercel.app' }}"
    steps:
      - name: Config check
        id: cfg
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Backstop idle — set the CRON_SECRET repo secret (and the SITE_URL variable) to enable it. pg_cron remains the primary scheduler. Skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Probe BEFORE draining so a stale heartbeat is observable — the drains
      # below refresh it. Warn-only: a hard pager belongs in an independent
      # monitor polling /api/health on its own cadence.
      - name: Health probe (pre-drain, warn-only)
        if: steps.cfg.outputs.configured == 'true'
        run: |
          code=$(curl -s -o /tmp/health.json -w "%{http_code}" "$SITE_URL/api/health")
          echo "health HTTP $code"; cat /tmp/health.json 2>/dev/null || true
          if [ "$code" != "200" ]; then echo "::warning::/api/health returned $code — a scheduler heartbeat is stale"; fi

      - name: Drain notification e-mail queue
        if: steps.cfg.outputs.configured == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/email.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/notify-email")
          echo "notify-email HTTP $code"; cat /tmp/email.json 2>/dev/null || true
          if [ "$code" != "200" ]; then echo "::warning::notify-email returned $code"; fi

      - name: Drain notification SMS queue
        if: steps.cfg.outputs.configured == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -s -o /tmp/sms.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/notify-sms")
          echo "notify-sms HTTP $code"; cat /tmp/sms.json 2>/dev/null || true
          if [ "$code" != "200" ]; then echo "::warning::notify-sms returned $code"; fi
